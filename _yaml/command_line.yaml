- sensor:
    name: CPU Temperature
    unique_id: cli_cpu_temperature
    command: "cat /sys/class/thermal/thermal_zone0/temp"
    # If errors occur, make sure configuration file is encoded as UTF-8
    unit_of_measurement: "°C"
    value_template: "{{ value | multiply(0.001) | round(1) }}"

- sensor:
    name: External IP Address
    unique_id: cli_external_ip_address
    command: "curl -s https://api.ipify.org"
    scan_interval: 300

- sensor:
    name: Proxy probes today
    unique_id: cli_proxy_probes_today
    command: "python3 /config/scripts/probe_stats.py"
    scan_interval: 300
    command_timeout: 30
    unit_of_measurement: "probes"
    state_class: total_increasing
    icon: mdi:shield-search
    value_template: "{{ value_json.today }}"
    json_attributes:
      - last_hour
      - last_24h
      - top_address_count
      - addresses_24h
      - hosts
      - addresses
      - countries
      - paths
      - bans
      - banned
      - updated

- sensor:
    name: Proxy blocked addresses
    unique_id: cli_proxy_blocked_addresses
    command: "python3 /config/scripts/proxy_block.py"
    scan_interval: 60
    command_timeout: 45
    unit_of_measurement: "addresses"
    icon: mdi:shield-off
    value_template: "{{ value_json.count }}"
    json_attributes:
      - blocked
      - last_blocked
      - error
      - updated

- sensor:
    name: Proxy certificate days left
    unique_id: cli_proxy_certificate_days_left
    command: "python3 /config/scripts/proxy_certificates.py"
    scan_interval: 86400
    command_timeout: 300
    unit_of_measurement: "d"
    icon: mdi:certificate
    value_template: "{{ value_json.days }}"
    json_attributes:
      - host
      - certificates
      - updated

- sensor:
    name: Proxy probe bursts
    unique_id: cli_proxy_probe_bursts
    command: "python3 /config/scripts/probe_bursts.py"
    scan_interval: 300
    command_timeout: 30
    unit_of_measurement: "bursts"
    icon: mdi:shield-search
    value_template: "{{ value_json.count }}"
    json_attributes:
      - bursts
      - updated
