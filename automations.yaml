- id: '1795290692189'
  alias: Shutters - Automate open (backup)
  description: Copy of Shutters - Automate open as it was before the temperature trigger
    replaced the morning polling. Kept disabled as a fallback.
  triggers:
  - device_id: ad05755c837a93408b2addf5f3428bd5
    domain: device_tracker
    entity_id: 23e9209e33aa806eace56679123e2064
    type: enters
    trigger: device
    zone: zone.home
    alias: Trigger when Michiel comes home
  - trigger: sun
    event: sunrise
    offset: 00:30
    alias: Trigger 30 minutes after sunrise
  - alias: Trigger every 10 minutes from 8:00 until 9:00
    trigger: time_pattern
    hours: '8'
    minutes: /10
  - alias: Trigger every 10 minutes from 9:00 until 10:00
    trigger: time_pattern
    hours: '9'
    minutes: /10
  conditions:
  - condition: and
    conditions:
    - condition: numeric_state
      entity_id: weather.buienradar
      attribute: temperature
      above: 5
      below: 25
    - condition: device
      device_id: ad05755c837a93408b2addf5f3428bd5
      domain: device_tracker
      entity_id: 23e9209e33aa806eace56679123e2064
      type: is_home
    - condition: sun
      before: sunset
    - condition: time
      after: 03:00:00
  actions:
  - alias: Open both shutters in parallel
    parallel:
    - alias: Open back shutter if it is not open
      if:
      - condition: numeric_state
        entity_id: cover.shutter_back
        attribute: current_position
        below: 40
      then:
      - device_id: 87fec662ee8dd99a998779420a0df21f
        domain: cover
        entity_id: ab8adbecf1dbd16bed4c55fdab901524
        type: set_position
        position: 75
    - alias: Open front shutter if it is not open
      if:
      - condition: numeric_state
        entity_id: cover.shutter_front
        attribute: current_position
        below: 40
      then:
      - device_id: a04597364adc21334952e4e620432ac3
        domain: cover
        entity_id: a06305603ccf50171c809860db3fd263
        type: set_position
        position: 75
  mode: single
- id: '1795295627969'
  alias: Notifications - Dismiss failed login from trusted network
  description: Dismisses the "Login attempt failed" notification when the address
    in it starts with the prefix in input_text.login_notification_trusted_prefix.
    The warning stays in the log.
  triggers:
  - alias: Trigger when the failed login notification is created or replaced
    trigger: persistent_notification
    notification_id: http-login
    update_type:
    - added
    - updated
  conditions:
  - alias: The address in the notification starts with the trusted prefix
    condition: template
    value_template: '{% set prefix = states(''input_text.login_notification_trusted_prefix'')
      %}

      {% set address = trigger.notification.message | regex_findall(''\(([0-9a-fA-F.:]+)\)'')
      | last | default('''', true) %}

      {{ has_value(''input_text.login_notification_trusted_prefix'') and prefix |
      length >= 4 and address.startswith(prefix) }}'
  actions:
  - alias: Dismiss the failed login notification
    action: persistent_notification.dismiss
    data:
      notification_id: http-login
  mode: single
- id: '1795297052760'
  alias: Notifications - Freezer socket off or unreachable
  description: 'Critical alert on the phone when the freezer socket is switched off,
    and a time-sensitive one when it has been unreachable for 15 minutes. An unreachable
    socket usually still has power: the Tuya devices lose their address after a DHCP
    renewal (ADR-0017).'
  triggers:
  - alias: Freezer socket has been off for a minute
    trigger: state
    entity_id: switch.power_socket_freezer
    to: 'off'
    for:
      minutes: 1
    id: 'off'
  - alias: Freezer socket has been unreachable for 15 minutes
    trigger: state
    entity_id: switch.power_socket_freezer
    to: unavailable
    for:
      minutes: 15
    id: unreachable
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - alias: Send a critical alert that the freezer has no power
        action: notify.mobile_app_iphone_michiel
        data:
          title: Freezer socket is OFF
          message: The freezer has no power. Switch the socket back on.
          data:
            push:
              interruption-level: critical
              sound:
                name: default
                critical: 1
                volume: 1
    default:
    - alias: Send a time-sensitive notification that the socket is unreachable
      action: notify.mobile_app_iphone_michiel
      data:
        title: Freezer socket unreachable
        message: Home Assistant has not reached the freezer socket for 15 minutes.
          It probably still has power, but its state is unknown.
        data:
          push:
            interruption-level: time-sensitive
  mode: single
- id: '1795297053137'
  alias: Notifications - Boiler needs attention
  description: Alerts the phone when the boiler asks for a refill, its pressure stays
    below 1 bar, or it reports a fault code. A maintenance request is sent as a normal
    notification, the rest as critical alerts.
  triggers:
  - alias: Boiler reports that a refill is needed
    trigger: state
    entity_id: binary_sensor.boiler_refill_needed
    to: 'on'
    id: refill
  - alias: System pressure has been below 1 bar for 10 minutes
    trigger: numeric_state
    entity_id: sensor.boiler_system_pressure
    below: 1
    for:
      minutes: 10
    id: pressure
  - alias: Boiler reports a blocking or locking fault code
    trigger: state
    entity_id:
    - sensor.boiler_blocking_fault_code
    - sensor.boiler_locking_fault_code
    not_to:
    - 'false'
    - unavailable
    - unknown
    id: fault
  - alias: Boiler requests maintenance
    trigger: state
    entity_id: sensor.boiler_maintenance_request
    not_to:
    - 'false'
    - unavailable
    - unknown
    id: maintenance
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: maintenance
      sequence:
      - alias: Send a normal notification about the maintenance request
        action: notify.mobile_app_iphone_michiel
        data:
          title: Boiler requests maintenance
          message: 'Maintenance request: {{ trigger.to_state.state }}'
    default:
    - alias: Send a critical alert with the sensor and its value
      action: notify.mobile_app_iphone_michiel
      data:
        title: Boiler needs attention
        message: '{{ trigger.to_state.name }}: {{ trigger.to_state.state }}{{ '' bar''
          if trigger.id == ''pressure'' else '''' }}'
        data:
          push:
            interruption-level: critical
            sound:
              name: default
              critical: 1
              volume: 1
  mode: queued
  max: 5
- id: '1795297053471'
  alias: Notifications - Waste pickup tomorrow
  description: At 19:00, notifies the phone which bins go out when a Twente Milieu
    pickup date is tomorrow.
  triggers:
  - alias: Every day at 19:00
    trigger: time
    at: '19:00:00'
  conditions:
  - alias: At least one pickup is tomorrow
    condition: template
    value_template: '{{ due | count > 0 }}'
  actions:
  - alias: Send the list of bins to put out
    action: notify.mobile_app_iphone_michiel
    data:
      title: Waste pickup tomorrow
      message: 'Put out: {{ due | join('', '') }}'
  variables:
    due: '{% set bins = {''sensor.twente_milieu_organic_waste_pickup'': ''Organic'',
      ''sensor.twente_milieu_packages_waste_pickup'': ''Packages'', ''sensor.twente_milieu_non_recyclable_waste_pickup'':
      ''Residual'', ''sensor.twente_milieu_christmas_tree_pickup'': ''Christmas tree''}
      %}{% set day = (now().date() + timedelta(days=1)) | string %}{{ bins.items()
      | selectattr(''0'', ''is_state'', day) | map(attribute=''1'') | list }}'
  mode: single
- id: '1795297053822'
  alias: Notifications - Backups stale
  description: Notifies the phone when the Google Drive Backup app reports that the
    backups are stale.
  triggers:
  - alias: Backups become stale
    trigger: state
    entity_id: binary_sensor.backups_stale
    to: 'on'
  conditions: []
  actions:
  - alias: Send a notification that backups are stale
    action: notify.mobile_app_iphone_michiel
    data:
      title: Backups are stale
      message: No recent backup has reached Google Drive. Check the Google Drive Backup
        app.
  mode: single
- id: '1795297682448'
  alias: Heating - Away mode by presence
  description: Turns the thermostat's away mode on when the phone leaves zone Goor
    and off when it enters Goor again, so the house is not heated while nobody is
    in town and warms up during the last minutes of the trip home.
  triggers:
  - alias: Cerbrus leaves Goor
    trigger: zone.left
    target:
      entity_id: person.cerbrus
    options:
      zone: zone.goor
    id: left
  - alias: Cerbrus enters Goor
    trigger: zone.entered
    target:
      entity_id: person.cerbrus
    options:
      zone: zone.goor
    id: entered
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: left
      sequence:
      - alias: Turn away mode on
        action: switch.turn_on
        target:
          entity_id: switch.heating_installation_settings_away_mode
    - conditions:
      - condition: trigger
        id: entered
      sequence:
      - alias: Turn away mode off
        action: switch.turn_off
        target:
          entity_id: switch.heating_installation_settings_away_mode
  mode: queued
  max: 2
